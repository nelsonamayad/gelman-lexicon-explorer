project:
  type: website
  output-dir: _site
  # Only .qmd files are pages; README.md, TODO.md and CLAUDE.md stay out of the site.
  render:
    - "**/*.qmd"
  resources:
    - js/stats.js
    - assets/
  # Removes the ES6 polyfill script Quarto adds next to MathJax.
  post-render: scripts/post_render.py

website:
  title: "Andrew Gelman Statistical Lexicon Explorer"
  description: "All 155 entries in Andrew Gelman's Handy Statistical Lexicon, each explained with an interactive simulation."
  # Public URL, used for the sitemap and social-media preview cards. The site
  # is published to Netlify (.github/workflows/publish.yml). If Netlify gives
  # the site a different name, or you add a custom domain, change it here.
  site-url: https://gelman-lexicon-explorer.netlify.app
  # "Edit this page" and "Report an issue" links on every page, so readers can
  # send corrections.
  repo-url: https://github.com/nelsonamayad/gelman-lexicon-explorer
  repo-branch: main
  repo-actions: [edit, issue]
  favicon: assets/logo.svg
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true
  # Social-media preview image (1200 x 630) for every page.
  image: assets/social-card.png
  image-alt: "Andrew Gelman Statistical Lexicon Explorer: all 155 entries, each with an interactive simulation."
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  # Google Analytics is added by _analytics.html (included below) and loads
  # only after the visitor accepts analytics cookies in this banner; the
  # footer gets a "Cookie preferences" link. See about.qmd#privacy.
  cookie-consent:
    type: express
    style: simple
    palette: light
    policy-url: about.html#privacy
    prefs-text: "Cookie preferences"
  navbar:
    logo: assets/logo.svg
    logo-alt: "Lexicon Explorer logo"
    title: "Statistical Lexicon Explorer"
    left:
      - href: index.qmd
        text: Browse all
      - text: Themes
        menu:
          - href: themes/noise-and-evidence.qmd
          - href: themes/building-and-checking-models.qmd
          - href: themes/causes-samples-populations.qmd
          - href: themes/showing-and-telling.qmd
          - href: themes/how-science-behaves.qmd
          - href: themes/thinking-about-statistics.qmd
      - text: Kinds
        menu:
          - href: kinds/methods.qmd
          - href: kinds/principles.qmd
          - href: kinds/fallacies.qmd
          - href: kinds/laws-and-aphorisms.qmd
          - href: kinds/advice.qmd
      - href: start-here.qmd
        text: Start here
      - href: random.qmd
        text: Random entry
      - href: r/index.qmd
        text: Try it in R
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/nelsonamayad/gelman-lexicon-explorer
        aria-label: Source code on GitHub
      - icon: box-arrow-up-right
        href: https://statmodeling.stat.columbia.edu/2009/05/24/handy_statistic/
        aria-label: Gelman's original lexicon
  # The sidebar (entries grouped by theme) is generated into _sidebar.yml by
  # scripts/build_groups.py and merged in through metadata-files below.
  page-footer:
    left: "Concepts from Andrew Gelman's [Handy Statistical Lexicon](https://statmodeling.stat.columbia.edu/2009/05/24/handy_statistic/). An independent study aid, not affiliated with or endorsed by Andrew Gelman."
    right:
      - text: About
        href: about.qmd
      - text: License
        href: about.qmd#license
      - text: Privacy
        href: about.qmd#privacy
      - icon: shuffle
        href: random.qmd
        aria-label: Random entry

brand: _brand.yml

metadata-files:
  - _sidebar.yml

# Every page shows its published date (`date` in each file's front matter) and
# its last-modified date, taken from the file's modification time. The publish
# workflow restores modification times from git history so this is accurate on
# Netlify builds.
date-modified: last-modified
date-format: long

format:
  html:
    css: styles.css
    # A canonical link on every page (pages are reachable with and without .html).
    canonical-url: true
    # Pin MathJax to an exact version instead of the floating mathjax@4.
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-chtml.js"
    include-in-header: _analytics.html
    include-after-body: _a11y.html
    toc: true
    toc-title: "On this page"
    code-fold: true
    code-summary: "Show simulation code"
    code-tools: false
    smooth-scroll: true
    anchor-sections: true

execute:
  echo: true
