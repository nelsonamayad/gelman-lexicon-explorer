# ALTERNATIVE DEPLOY TARGET (manual only). The primary deploy is Posit Connect
# Cloud (publish.yml). Run this from the Actions tab if you also want a Netlify
# copy of the site.
#
# Build the Quarto site and deploy it to Netlify.
#
# One-time setup:
#   1. Create an empty site in Netlify (Add new site -> Deploy manually, or
#      `npx netlify-cli sites:create`). Turn OFF Netlify's own builds for it;
#      this workflow does the building.
#   2. In the GitHub repo, add two secrets (Settings -> Secrets and variables
#      -> Actions):
#        NETLIFY_AUTH_TOKEN  a personal access token from Netlify
#                            (User settings -> Applications -> New access token)
#        NETLIFY_SITE_ID     the site's "Site ID" (Site configuration -> General)
#
# A manual run deploys to production.

name: Publish to Netlify (manual)

on:
  workflow_dispatch:

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed for the modified dates below

      # Pages show "Modified" from each file's modification time
      # (date-modified: last-modified in _quarto.yml). A fresh checkout stamps
      # every file with the current time, so reset each tracked file's mtime to
      # its last commit date.
      - name: Restore file modification times from git
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            ts=$(git log -1 --format=%cI -- "$f")
            [ -n "$ts" ] && touch -d "$ts" "$f"
          done

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.11

      - name: Render site
        run: quarto render

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: >
          npx --yes netlify-cli@17 deploy
          --dir=_site --prod
          --message "Deploy ${{ github.sha }}"
