# Check the site, build it and publish it to Netlify.
#
# - Every pull request: run all checks, deploy nothing. A suggested correction
#   can't break a page without the check failing first.
# - Every push to main: run all checks, then deploy to production.
#
# One-time setup:
#   1. Publish once by hand with `quarto publish netlify`. That created the
#      site https://gelman-lexicon-explorer.netlify.app and wrote _publish.yml
#      (the site's ID and URL, no secrets). Commit _publish.yml: this workflow
#      uses it to update the same site.
#   2. In the GitHub repository, add one secret (Settings -> Secrets and
#      variables -> Actions):
#        NETLIFY_AUTH_TOKEN  a personal access token from Netlify
#                            (User settings -> Applications -> Personal access tokens)
#      Until it exists, pushes to main still run the checks and skip the deploy.
#
# Netlify never builds the site itself (see netlify.toml); this workflow does.

name: Check and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed for the modified dates below

      # Pages show "Modified" from each file's modification time
      # (date-modified: last-modified in _quarto.yml). A fresh checkout stamps
      # every file with the current time, so reset each tracked file's mtime to
      # its last commit date.
      - name: Restore file modification times from git
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            ts=$(git log -1 --format=%cI -- "$f")
            [ -n "$ts" ] && touch -d "$ts" "$f"
          done

      # Front matter, section order, plot accessibility labels, seeds, links,
      # reciprocal Related entries.
      - name: Check entries
        run: python3 scripts/check_entries.py

      # Every entry's code tabs show R and Python versions of its simulation
      # (sims/r/*.R, base R only; sims/python/*.py, NumPy and Matplotlib).
      # Run them all so a broken one fails the build.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install NumPy and Matplotlib
        run: python3 -m pip install --quiet numpy matplotlib

      - name: Run the R and Python simulations
        run: python3 scripts/check_code.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.12.1

      - name: Render site
        run: quarto render

      # quarto render only checks OJS syntax. This loads every page in headless
      # Chrome (preinstalled on GitHub's Ubuntu runners) and fails on any
      # runtime error box or entry page without a chart.
      - name: Check every page in a browser
        run: python3 scripts/check_pages.py _site

      # Publishes the _site/ checked above (--no-render) to the site recorded
      # in _publish.yml.
      - name: Publish to Netlify
        if: github.event_name != 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN is not set, so the site was checked but not published. See the setup notes at the top of .github/workflows/publish.yml."
            exit 0
          fi
          quarto publish netlify --no-render --no-prompt --no-browser
