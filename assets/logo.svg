<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Bayesian statistical lexicon explorer logo</title>
  <desc id="desc">Three overlapping probability curves represent a prior, likelihood, and posterior distribution.</desc>
  <rect width="64" height="64" rx="14" fill="#1d4e89"/>
  <path d="M9 47.5H55" fill="none" stroke="#9ecae1" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Prior: broad, deliberately quiet. -->
  <path d="M10 47 C16 47 17.5 28 28.5 28 C39.5 28 42 47 53 47" fill="none" stroke="#9ecae1" stroke-width="3" stroke-linecap="round"/>
  <!-- Likelihood: concentrated evidence, shifted to the right. -->
  <path d="M22 47 C27 47 28.5 23 37 23 C45.5 23 47 47 52 47" fill="none" stroke="#f4a582" stroke-width="3" stroke-linecap="round"/>
  <!-- Posterior: the combined, most precise belief. -->
  <path d="M25 47 C29 47 30.5 14 34.5 14 C38.5 14 40 47 44 47" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="34.5" cy="14" r="2.35" fill="#ffffff"/>
</svg>
