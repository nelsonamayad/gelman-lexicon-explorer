<!-- Google Analytics, loaded only after the visitor accepts analytics cookies.
     The cookie-consent banner (cookie-consent in _quarto.yml) runs scripts
     marked cookie-consent="tracking" once consent is given; until then, no
     request goes to Google. -->
<script type="text/plain" cookie-consent="tracking">
  (function () {
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtag/js?id=G-J8020S97FB";
    document.head.appendChild(s);
  })();
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag("js", new Date());
  gtag("config", "G-J8020S97FB", { anonymize_ip: true });
</script>
